## Server Properties
server.port=8000
server.scheme=http
server.host=localhost
spring.application.name=co-evolution-adapter
spring.mvc.format.date-time=iso
service.cve_scan=CVE_SCAN
server.servlet.context-path=/co-evolution-adapter-service

## Mitigate
mitigate.base-url=${MITIGATE_BASE_URL:}
mitigate.scan-url=/mitigate-scanner-service
mitigate.partner-url=/partner

## OpenAPI Properties
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/docs
springdoc.api-docs.title=co-evolution-adapter-service
springdoc.api-docs.subtitle=co-evolution-adapter-service


## Auth Properties
keycloak.auth-server-url=${KC_HOST:}
keycloak.realm=${KC_REALM:}
keycloak.client-id=${KC_CLIENT_NAME:}
keycloak.client-secret=${KC_CLIENT_SECRET:}

################################
## File Properties
################################
spring.servlet.multipart.max-file-size=150280KB
spring.servlet.multipart.max-request-size=150280KB
spring.servlet.multipart.enabled=true

spring.main.allow-bean-definition-overriding=true


## Kafka Configuration
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

## Ragre Report Upload
ragre.report-upload.base-url=${AEGIS_FILES_BASE_URL:}
ragre.report-upload.endpoint=/files/upload
ragre.report-search.endpoint=/files/search
ragre.report-download.endpoint=/files/download
ragre.kafka.model-registration.topic=ragre_models
ragre.kafka.all-topics.group-id=ragre-engine-group
ragre.kafka.assessment-reports.topic=assessment_reports
ragre.kafka.ethical-guidelines.topic=ethical_guidelines

## AEGIS Auth
aegis.auth.token-url=${AEGIS_TOKEN_URL:}
aegis.auth.client-id=${AEGIS_CLIENT_ID:}
aegis.auth.username=${AEGIS_USERNAME:}
aegis.auth.password=${AEGIS_PASSWORD:}
